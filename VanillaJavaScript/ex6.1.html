<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Example</title>
</head>
<body>
    <h1>Alert</h1>
    <button onclick="showAlert()">Click me to show an alert!</button>

    <script>
        function showAlert() 
        {
            window.alert("Hello from alert!");
        }
    </script>
</body>
</html>
