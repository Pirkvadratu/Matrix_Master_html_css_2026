<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Image</title>
</head>
<body>
    <h1>Change Image</h1>
    
    <img id="myImage" src="https://via.placeholder.com/300x200/0000FF/FFFFFF?text=Image+1" alt="Sample Image" style="width: 300px; height: 200px;">
    <br><br>
    <button onclick="changeImage()">Change Image</button>

    <script>
        let imageCount = 1;
        
        function changeImage() 
        {
            let img = document.getElementById("myImage");
            imageCount++;
            if (imageCount > 3) 
            {
                imageCount = 1;
            }
            img.src = `https://via.placeholder.com/300x200/FF0000/FFFFFF?text=Image+${imageCount}`;
        }
    </script>
</body>
</html>
